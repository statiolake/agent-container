services:
  proxy:
    image: agent-container-proxy:dev
    networks:
      - jail
      - egress
    extra_hosts:
      # Solely for native Linux Docker. On Docker Desktop and Rancher
      # Desktop `host.docker.internal` is already injected into the
      # container's resolver by the engine itself, so this entry is
      # redundant (Docker Desktop: also routes correctly; Rancher Desktop:
      # routes wrong, but we don't rely on it — see host_kind.rs, which
      # makes the CLI hand the container a `host.lima.internal` URL
      # instead). On native Linux Docker `host.docker.internal` is not
      # defined at all, and `host-gateway` resolves it to the docker
      # bridge gateway — the host as seen from the container.
      - "host.docker.internal:host-gateway"
    volumes:
      - "${ALLOWLIST_PATH}:/etc/tinyproxy/allowlist.txt:ro"
    restart: "no"

  agent:
    image: agent-container:dev
    depends_on:
      proxy:
        condition: service_started
    networks:
      - jail
    environment:
      - HTTP_PROXY=http://proxy:8888
      - HTTPS_PROXY=http://proxy:8888
      - http_proxy=http://proxy:8888
      - https_proxy=http://proxy:8888
      - NO_PROXY=localhost,127.0.0.1,proxy
      - no_proxy=localhost,127.0.0.1,proxy
      - IS_SANDBOX=1
      - TINI_SUBREAPER=1
      # Inherit the host terminal so the in-container TUIs (Claude Code,
      # Codex) pick the right colour palette. Sensible defaults for
      # non-interactive or unknown hosts.
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM:-truecolor}
      # Bedrock pathway. Credentials themselves never travel through env
      # vars — the container's awsCredentialExport command fetches them
      # from the broker on demand. AWS_PROFILE / AWS_ACCESS_KEY_ID /
      # AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN are intentionally NOT
      # forwarded so the host's own AWS environment can't hijack which
      # account the container transacts against.
      - CLAUDE_CODE_USE_BEDROCK=${CLAUDE_CODE_USE_BEDROCK:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      - AGENT_CONTAINER_HOST_ENDPOINT=${AGENT_CONTAINER_HOST_ENDPOINT}
    volumes:
      # Persistent $HOME so onboarding, login, settings, and Claude Code's
      # ~/.claude.json survive across runs. Specific sub-mounts below
      # override individual paths that must stay ephemeral or workspace-scoped.
      - "${CONTAINER_HOME_PATH}:/home/agent"
      - "${WORKSPACE_PATH}:${CONTAINER_WORKSPACE_PATH}"
      - "${WORKSPACE_AGENT_CONTAINER_MOUNT_SRC}:${CONTAINER_WORKSPACE_PATH}/.agent-container:ro"
      - "${HOST_PROJECT_DIR}:/home/agent/.claude/projects/${CONTAINER_PROJECT_DIR_NAME}"
      - "${CREDENTIALS_PATH}:/home/agent/.claude/.credentials.json"
      - "${CLAUDE_MD_MOUNT_SRC}:/home/agent/.claude/CLAUDE.md:ro"
      - "${CODEX_AUTH_PATH}:/home/agent/.codex/auth.json"
      - "${CODEX_SESSIONS_DIR}:/home/agent/.codex/sessions"
      - "${CODEX_ARCHIVED_SESSIONS_DIR}:/home/agent/.codex/archived_sessions"
      - "${CODEX_SHELL_SNAPSHOTS_DIR}:/home/agent/.codex/shell_snapshots"
      - "${CODEX_SESSION_INDEX_PATH}:/home/agent/.codex/session_index.jsonl"
      - "${CODEX_HISTORY_PATH}:/home/agent/.codex/history.jsonl"
    user: "${HOST_UID}:${HOST_GID}"
    working_dir: "${CONTAINER_WORKSPACE_PATH}"
    stdin_open: true
    tty: true
    init: true

networks:
  jail:
    driver: bridge
    internal: true
  egress:
    driver: bridge
